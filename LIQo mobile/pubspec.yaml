name: liqo_mobile
description: "LIQo shopper app: indoor wayfinding for LIQo malls."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

# Pinned exactly, like Gabay/app (owner decision 2026-10-22).
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 18.0.2
  shared_preferences: 2.5.6
  path_drawing: 1.0.1
  collection: 1.19.1
  url_launcher: 6.3.3
  share_plus: 13.3.1
  # the icon font some Flutter widgets use on iOS (the template's own package)
  cupertino_icons: 1.0.9
  # the shopper server: requests, saved packages, download checksums, Wi-Fi or mobile data
  http: 1.6.0
  path_provider: 2.1.6
  crypto: 3.0.7
  connectivity_plus: 7.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/licenses/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
